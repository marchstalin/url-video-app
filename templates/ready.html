<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your file is ready</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      .card { max-width: 800px; margin: 20px auto; }
      .small { font-size: 0.9em; color:#555 }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Your file is ready</h1>
      <p class="small">Preview the video below, or download the original file.</p>
      <video controls preload="metadata" style="display:block; width:100%; max-height:520px; background:#111; margin:20px 0">
        <source src="{{ url_for('preview_file', token=token) }}" type="video/mp4">
        Your browser does not support video playback.
      </video>
      <a href="{{ url_for('serve_file', token=token) }}" download>
        <button type="button">Download {{ filename }}</button>
      </a>
      <p class="small"><a href="{{ url_for('index') }}">Return</a></p>
    </div>
  </body>
</html>
