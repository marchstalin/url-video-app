<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>URL Video Downloader</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      .banner { max-width: 100%; height: 120px; object-fit: cover; border: 1px solid #ddd }
      .card { max-width: 800px; margin: 20px auto; }
      label { display:block; margin-top:8px }
      textarea { width:100%; height:100px }
      input[type=text] { width:100% }
      .small { font-size: 0.9em; color:#555 }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="banner" src="{{ url_for('static', filename='banner-eu.svg') }}" alt="banner">
      <h1>URL Video Downloader</h1>
      <p class="small">Paste a video page URL (YouTube, Instagram, etc.). No login required.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul>
          {% for m in messages %}
            <li style="color:red">{{ m }}</li>
          {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <form method="post" action="/download" enctype="multipart/form-data">
        <label>Page URL</label>
        <input type="text" name="url" placeholder="https://..." required>

        <label for="quality">Format and quality</label>
        <select id="quality" name="quality">
          <option value="mp4_best">MP4 - Best available</option>
          <option value="mp4_1080">MP4 - Up to 1080p</option>
          <option value="mp4_720">MP4 - Up to 720p</option>
          <option value="mp4_480">MP4 - Up to 480p</option>
          <option value="mp4_360">MP4 - Up to 360p</option>
          <option value="muted_1080">MP4 - Up to 1080p, muted</option>
          <option value="muted_720">MP4 - Up to 720p, muted</option>
          <option value="muted_480">MP4 - Up to 480p, muted</option>
          <option value="muted_360">MP4 - Up to 360p, muted</option>
          <option value="mp3">MP3 - Audio only</option>
        </select>

        <!-- Cookies and proxy inputs removed for testing; app will attempt direct downloads -->

        <div style="margin-top:12px">
          <label style="display:inline-block; margin-right:12px"><input type="checkbox" name="test_only"> Test only (no download)</label>
          <button type="submit">Download</button>
        </div>
      </form>

      <p class="small">Default banner is EU; switch region to see other banner.</p>
    </div>
  </body>
</html>
